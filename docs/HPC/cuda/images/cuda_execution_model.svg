<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="monospace">
  <!-- Background -->
  <rect width="800" height="460" fill="#ffffff"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">CUDA Grid / Block / Thread Hierarchy</text>

  <!-- Outer grid box -->
  <rect x="50" y="50" width="700" height="300" rx="6" ry="6" fill="#d6eaf8" stroke="#2980b9" stroke-width="2.5"/>
  <text x="400" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#2980b9">Grid (numBlocks = 8 x 8)</text>

  <!-- Block 0,0 -->
  <rect x="100" y="95" width="150" height="110" rx="4" ry="4" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="175" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Block (0,0)</text>
  <rect x="112" y="120" width="126" height="72" fill="#ebf5fb" stroke="#2980b9" stroke-width="1"/>
  <text x="175" y="140" text-anchor="middle" font-size="8" fill="#2c3e50">16 x 16 threads</text>
  <text x="175" y="155" text-anchor="middle" font-size="8" fill="#2c3e50">threadIdx.x, threadIdx.y</text>
  <text x="175" y="175" text-anchor="middle" font-size="8" fill="#2c3e50">i = blockIdx.x*blockDim.x</text>
  <text x="175" y="187" text-anchor="middle" font-size="8" fill="#2c3e50">      + threadIdx.x</text>

  <!-- Block 0,1 -->
  <rect x="270" y="95" width="150" height="110" rx="4" ry="4" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
  <text x="345" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Block (1,0)</text>
  <rect x="282" y="120" width="126" height="72" fill="#eafaf1" stroke="#27ae60" stroke-width="1"/>
  <text x="345" y="140" text-anchor="middle" font-size="8" fill="#2c3e50">16 x 16 threads</text>
  <text x="345" y="160" text-anchor="middle" font-size="8" fill="#2c3e50">covers next 16</text>
  <text x="345" y="172" text-anchor="middle" font-size="8" fill="#2c3e50">columns of the grid</text>

  <!-- Block 1,0 -->
  <rect x="440" y="95" width="150" height="110" rx="4" ry="4" fill="#e67e22" stroke="#d35400" stroke-width="2"/>
  <text x="515" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Block (0,1)</text>
  <rect x="452" y="120" width="126" height="72" fill="#fdf2e9" stroke="#d35400" stroke-width="1"/>
  <text x="515" y="140" text-anchor="middle" font-size="8" fill="#2c3e50">16 x 16 threads</text>
  <text x="515" y="160" text-anchor="middle" font-size="8" fill="#2c3e50">j = blockIdx.y*blockDim.y</text>
  <text x="515" y="172" text-anchor="middle" font-size="8" fill="#2c3e50">      + threadIdx.y</text>

  <!-- Block ... -->
  <rect x="610" y="95" width="120" height="110" rx="4" ry="4" fill="#8e44ad" stroke="#6c3483" stroke-width="2"/>
  <text x="670" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Block (7,7)</text>
  <rect x="622" y="120" width="96" height="72" fill="#f4ecf7" stroke="#6c3483" stroke-width="1"/>
  <text x="670" y="140" text-anchor="middle" font-size="8" fill="#2c3e50">last block</text>
  <text x="670" y="155" text-anchor="middle" font-size="8" fill="#2c3e50">covers remaining</text>
  <text x="670" y="167" text-anchor="middle" font-size="8" fill="#2c3e50">edge threads</text>

  <!-- Boundary check note -->
  <rect x="100" y="225" width="630" height="45" rx="4" ry="4" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>
  <text x="415" y="243" text-anchor="middle" font-size="10" font-weight="bold" fill="#2c3e50">if (i &lt; nx &amp;&amp; j &lt; ny) { ... }</text>
  <text x="415" y="260" text-anchor="middle" font-size="9" fill="#7f8c8d">Extra threads at the grid edges are masked off so they never touch memory out of bounds</text>

  <!-- Device global memory -->
  <rect x="100" y="285" width="630" height="50" rx="4" ry="4" fill="#ebf5fb" stroke="#2980b9" stroke-width="1.5"/>
  <text x="415" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#2980b9">Device Global Memory</text>
  <text x="415" y="320" text-anchor="middle" font-size="9" fill="#2c3e50">d_con[i * ny + j]  |  d_dfdcon  |  d_lap_con  |  d_dummy_con  |  d_lap_dummy  |  d_con_new</text>

  <!-- Arrows from blocks to memory -->
  <line x1="175" y1="205" x2="300" y2="285" stroke="#7f8c8d" stroke-width="1.2"/>
  <line x1="345" y1="205" x2="380" y2="285" stroke="#7f8c8d" stroke-width="1.2"/>
  <line x1="515" y1="205" x2="480" y2="285" stroke="#7f8c8d" stroke-width="1.2"/>
  <line x1="670" y1="205" x2="560" y2="285" stroke="#7f8c8d" stroke-width="1.2"/>

  <!-- Legend -->
  <rect x="50" y="370" width="700" height="70" rx="4" ry="4" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="70" y="392" font-size="10" fill="#2c3e50" font-weight="bold">Every thread computes one (i, j) grid point independently:</text>
  <text x="70" y="410" font-size="9" fill="#7f8c8d">Grid → made of Blocks (dim3 numBlocks) → made of Threads (dim3 threadsPerBlock = 16x16)</text>
  <text x="70" y="425" font-size="9" fill="#7f8c8d">All threads across all blocks share the same device global memory arrays.</text>
</svg>
