  <text x="210" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#2980b9">2 neighbors per process</text>
  
  <!-- Arrow between 1D and 2D -->
  <line x1="380" y1="200" x2="430" y2="200" stroke="#2c3e50" stroke-width="2.5"/>
  <polygon points="425,194 435,200 425,206" fill="#2c3e50"/>
  <text x="405" y="190" text-anchor="middle" font-size="10" fill="#2c3e50">vs</text>
  
