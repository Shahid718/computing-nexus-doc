<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 380" font-family="monospace">
  <!-- Background -->
  <rect width="850" height="380" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="425" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">Decomposition Comparison</text>
  
  <!-- 1D Decomposition -->
  <text x="210" y="60" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">1D Decomposition (This code)</text>
  
  <!-- 1D grid - 4 rows x 2 columns -->
  <!-- Row 1 -->
  <rect x="60" y="80" width="150" height="60" rx="3" fill="#d6eaf8" stroke="#2980b9" stroke-width="2"/>
  <text x="135" y="116" text-anchor="middle" font-size="14" font-weight="bold" fill="#2980b9">Process 0</text>
  
  <rect x="210" y="80" width="150" height="60" rx="3" fill="#d5f5e3" stroke="#27ae60" stroke-width="2"/>
  <text x="285" y="116" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">Process 1</text>
  
  <!-- Row 2 -->
  <rect x="60" y="140" width="150" height="60" rx="3" fill="#fdebd0" stroke="#e67e22" stroke-width="2"/>
  <text x="135" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="#e67e22">Process 2</text>
  
  <rect x="210" y="140" width="150" height="60" rx="3" fill="#ebdef0" stroke="#8e44ad" stroke-width="2"/>
  <text x="285" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="#8e44ad">Process 3</text>
  
  <!-- Row 3 -->
