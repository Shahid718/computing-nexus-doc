  <text x="135" y="236" text-anchor="middle" font-size="14" font-weight="bold" fill="#e74c3c">Process 4</text>
  
  <rect x="210" y="200" width="150" height="60" rx="3" fill="#f9e79f" stroke="#f1c40f" stroke-width="2"/>
  <text x="285" y="236" text-anchor="middle" font-size="14" font-weight="bold" fill="#7d6608">Process 5</text>
  
  <!-- Row 4 -->
  <rect x="60" y="260" width="150" height="60" rx="3" fill="#d5dbdb" stroke="#7f8c8d" stroke-width="2"/>
  <text x="135" y="296" text-anchor="middle" font-size="14" font-weight="bold" fill="#7f8c8d">Process 6</text>
  
  <rect x="210" y="260" width="150" height="60" rx="3" fill="#aed6f1" stroke="#5b7f9a" stroke-width="2"/>
  <text x="285" y="296" text-anchor="middle" font-size="14" font-weight="bold" fill="#5b7f9a">Process 7</text>
  
  <!-- 1D neighbors information -->
