  <text x="498" y="210" text-anchor="middle" font-size="10" font-weight="bold" fill="#e67e22">P20</text>
  
  <rect x="536" y="180" width="76" height="50" rx="2" fill="#ebdef0" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="574" y="210" text-anchor="middle" font-size="10" font-weight="bold" fill="#8e44ad">P21</text>
  
  <rect x="612" y="180" width="76" height="50" rx="2" fill="#fadbd8" stroke="#e74c3c" stroke-width="1.5"/>
