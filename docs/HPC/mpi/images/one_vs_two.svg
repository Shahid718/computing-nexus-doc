  <text x="802" y="210" text-anchor="middle" font-size="10" font-weight="bold" fill="#5b7f9a">P24</text>
  
  <!-- Row 4 -->
  <rect x="460" y="230" width="76" height="50" rx="2" fill="#d5dbdb" stroke="#7f8c8d" stroke-width="1.5"/>
  <text x="498" y="260" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f8c8d">P30</text>
  
  <rect x="536" y="230" width="76" height="50" rx="2" fill="#d6eaf8" stroke="#2980b9" stroke-width="1.5"/>
  <text x="574" y="260" text-anchor="middle" font-size="10" font-weight="bold" fill="#2980b9">P31</text>
  
  <rect x="612" y="230" width="76" height="50" rx="2" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/>
  <text x="650" y="260" text-anchor="middle" font-size="10" font-weight="bold" fill="#27ae60">P32</text>
  
  <rect x="688" y="230" width="76" height="50" rx="2" fill="#fdebd0" stroke="#e67e22" stroke-width="1.5"/>
  <text x="726" y="260" text-anchor="middle" font-size="10" font-weight="bold" fill="#e67e22">P33</text>
  
  <rect x="764" y="230" width="76" height="50" rx="2" fill="#ebdef0" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="802" y="260" text-anchor="middle" font-size="10" font-weight="bold" fill="#8e44ad">P34</text>
  
  <!-- 2D neighbors information -->
  <rect x="460" y="330" width="380" height="35" rx="4" ry="4" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>
  <text x="650" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#2980b9">4 neighbors per process</text>
  
  <!-- Comparison lines -->
  <line x1="135" y1="390" x2="135" y2="370" stroke="#2980b9" stroke-width="1" stroke-dasharray="3,3"/>
