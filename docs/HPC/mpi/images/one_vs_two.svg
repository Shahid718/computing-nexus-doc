  <rect x="612" y="130" width="76" height="50" rx="2" fill="#d5dbdb" stroke="#7f8c8d" stroke-width="1.5"/>
  <text x="650" y="160" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f8c8d">P12</text>
  
  <rect x="688" y="130" width="76" height="50" rx="2" fill="#d6eaf8" stroke="#2980b9" stroke-width="1.5"/>
  <text x="726" y="160" text-anchor="middle" font-size="10" font-weight="bold" fill="#2980b9">P13</text>
  
