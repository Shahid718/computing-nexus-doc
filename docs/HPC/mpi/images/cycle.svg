<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 820" font-family="monospace">
  <!-- Background -->
  <rect width="850" height="820" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="425" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">Complete Communication Cycle</text>
  
  <!-- Subtitle -->
  <text x="425" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="#34495e">Time Step Execution Flow for Process i</text>
  
  <!-- Main box -->
  <rect x="40" y="75" width="770" height="700" rx="6" ry="6" fill="#f8f9fa" stroke="#2c3e50" stroke-width="2.5"/>
  
  <!-- Step 1: Exchange left halo -->
  <rect x="60" y="90" width="730" height="90" rx="4" ry="4" fill="#d6eaf8" stroke="#2980b9" stroke-width="1.5"/>
  <text x="80" y="112" font-size="13" font-weight="bold" fill="#2980b9">1. Exchange left halo with Process i-1</text>
  
  <rect x="100" y="122" width="660" height="40" rx="3" fill="#ebf5fb" stroke="#2980b9" stroke-width="1"/>
  <text x="120" y="140" font-size="11" fill="#2c3e50">Send con[1] ─────► Process i-1</text>
  <text x="120" y="155" font-size="11" fill="#2c3e50">Receive con[0] ◄───── Process i-1</text>
  
  <!-- Arrow down from Step 1 -->
  <line x1="425" y1="180" x2="425" y2="195" stroke="#7f8c8d" stroke-width="2"/>
  <polygon points="419,190 431,190 425,198" fill="#7f8c8d"/>
  
  <!-- Step 2: Exchange right halo -->
  <rect x="60" y="200" width="730" height="90" rx="4" ry="4" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/>
  <text x="80" y="222" font-size="13" font-weight="bold" fill="#27ae60">2. Exchange right halo with Process i+1</text>
  
  <rect x="100" y="232" width="660" height="40" rx="3" fill="#eafaf1" stroke="#27ae60" stroke-width="1"/>
  <text x="120" y="250" font-size="11" fill="#2c3e50">Send con[local_Nx] ──► Process i+1</text>
  <text x="120" y="265" font-size="11" fill="#2c3e50">Receive con[local_Nx+1] ◄── Process i+1</text>
  
  <!-- Arrow down from Step 2 -->
  <line x1="425" y1="290" x2="425" y2="305" stroke="#7f8c8d" stroke-width="2"/>
  <polygon points="419,300 431,300 425,308" fill="#7f8c8d"/>
  
  <!-- Step 3: Compute dfdcon and lap_con -->
  <rect x="60" y="310" width="730" height="55" rx="4" ry="4" fill="#fdebd0" stroke="#e67e22" stroke-width="1.5"/>
  <text x="80" y="335" font-size="13" font-weight="bold" fill="#e67e22">3. Compute dfdcon and lap_con</text>
  <text x="100" y="355" font-size="11" fill="#2c3e50">(no communication)</text>
  
  <!-- Arrow down from Step 3 -->
  <line x1="425" y1="365" x2="425" y2="380" stroke="#7f8c8d" stroke-width="2"/>
  <polygon points="419,375 431,375 425,383" fill="#7f8c8d"/>
  
  <!-- Step 4: Exchange dummy_con halos -->
  <rect x="60" y="385" width="730" height="55" rx="4" ry="4" fill="#ebdef0" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="80" y="410" font-size="13" font-weight="bold" fill="#8e44ad">4. Exchange dummy_con halos</text>
  <text x="100" y="430" font-size="11" fill="#2c3e50">(repeat steps 1-2)</text>
  
  <!-- Arrow down from Step 4 -->
  <line x1="425" y1="440" x2="425" y2="455" stroke="#7f8c8d" stroke-width="2"/>
  <polygon points="419,450 431,450 425,458" fill="#7f8c8d"/>
  
  <!-- Step 5: Compute lap_dummy and update con_new -->
  <rect x="60" y="460" width="730" height="55" rx="4" ry="4" fill="#fadbd8" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="80" y="485" font-size="13" font-weight="bold" fill="#e74c3c">5. Compute lap_dummy and update con_new</text>
  <text x="100" y="505" font-size="11" fill="#2c3e50">Euler time integration</text>
  
  <!-- Arrow down from Step 5 -->
  <line x1="425" y1="515" x2="425" y2="530" stroke="#7f8c8d" stroke-width="2"/>
  <polygon points="419,525 431,525 425,533" fill="#7f8c8d"/>
  
  <!-- Step 6: Swap con and con_new -->
  <rect x="60" y="535" width="730" height="55" rx="4" ry="4" fill="#f9e79f" stroke="#f1c40f" stroke-width="1.5"/>
  <text x="80" y="560" font-size="13" font-weight="bold" fill="#7d6608">6. Swap con and con_new</text>
  <text x="100" y="580" font-size="11" fill="#2c3e50">Ready for next time step</text>
  
  <!-- Arrow down from Step 6 -->
  <line x1="425" y1="590" x2="425" y2="605" stroke="#7f8c8d" stroke-width="2"/>
  <polygon points="419,600 431,600 425,608" fill="#7f8c8d"/>
  
  <!-- Step 7: Optional Print progress -->
  <rect x="60" y="610" width="730" height="50" rx="4" ry="4" fill="#f2d7d5" stroke="#a93226" stroke-width="1.5"/>
  <text x="80" y="635" font-size="13" font-weight="bold" fill="#a93226">7. (Optional) Print progress</text>
  <text x="100" y="652" font-size="11" fill="#2c3e50">Output iteration information</text>
  
  <!-- Communication labels on the right side -->
  <text x="610" y="117" font-size="9" fill="#7f8c8d">(communication)</text>
  <text x="610" y="225" font-size="9" fill="#7f8c8d">(communication)</text>
  <text x="610" y="410" font-size="9" fill="#7f8c8d">(communication)</text>
  
  <!-- Small arrows between send/receive -->
  <text x="620" y="143" font-size="10" fill="#e74c3c">→</text>
  <text x="620" y="158" font-size="10" fill="#2980b9">←</text>
  <text x="650" y="253" font-size="10" fill="#e74c3c">→</text>
  <text x="650" y="268" font-size="10" fill="#2980b9">←</text>
  
  <!-- Legend -->
  <rect x="40" y="785" width="770" height="25" rx="4" ry="4" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="60" y="802" font-size="10" fill="#7f8c8d">Communication steps use MPI_Sendrecv | Computation steps are local (no communication)</text>
</svg>