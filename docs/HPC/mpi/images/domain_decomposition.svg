<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="monospace">
  <!-- Background -->
  <rect width="800" height="420" fill="#ffffff"/>
  
  <!-- Main outer box -->
  <rect x="20" y="10" width="760" height="390" rx="6" ry="6" fill="none" stroke="#2c3e50" stroke-width="2.5"/>
  
  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">Global Domain (Nx = 8, Ny = 8, size = 4 processes)</text>
  
  <!-- Subtitle -->
  <text x="400" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#34495e">Domain Decomposition</text>
  
  <!-- Four process boxes -->
  <!-- Process 0 -->
  <rect x="60" y="90" width="155" height="130" rx="4" ry="4" fill="#d6eaf8" stroke="#2980b9" stroke-width="2"/>
  <rect x="60" y="90" width="155" height="30" rx="4" ry="4" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="137" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Process 0</text>
  <text x="137" y="138" text-anchor="middle" font-size="12" fill="#2c3e50">(2x8)</text>
  
  <!-- Grid dots for Process 0 - 2 rows x 8 columns -->
  <g fill="#2c3e50">
    <!-- Row 1 (y=160) -->
    <circle cx="78" cy="160" r="4"/>
    <circle cx="96" cy="160" r="4"/>
    <circle cx="114" cy="160" r="4"/>
    <circle cx="132" cy="160" r="4"/>
    <circle cx="150" cy="160" r="4"/>
    <circle cx="168" cy="160" r="4"/>
    <circle cx="186" cy="160" r="4"/>
    <circle cx="204" cy="160" r="4"/>
    <!-- Row 2 (y=180) -->
    <circle cx="78" cy="180" r="4"/>
    <circle cx="96" cy="180" r="4"/>
    <circle cx="114" cy="180" r="4"/>
    <circle cx="132" cy="180" r="4"/>
    <circle cx="150" cy="180" r="4"/>
    <circle cx="168" cy="180" r="4"/>
    <circle cx="186" cy="180" r="4"/>
    <circle cx="204" cy="180" r="4"/>
  </g>
  
  <!-- Process 1 -->
  <rect x="235" y="90" width="155" height="130" rx="4" ry="4" fill="#d5f5e3" stroke="#27ae60" stroke-width="2"/>
  <rect x="235" y="90" width="155" height="30" rx="4" ry="4" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
  <text x="312" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Process 1</text>
  <text x="312" y="138" text-anchor="middle" font-size="12" fill="#2c3e50">(2x8)</text>
  
  <!-- Grid dots for Process 1 - 2 rows x 8 columns -->
  <g fill="#2c3e50">
    <!-- Row 1 -->
    <circle cx="253" cy="160" r="4"/>
    <circle cx="271" cy="160" r="4"/>
    <circle cx="289" cy="160" r="4"/>
    <circle cx="307" cy="160" r="4"/>
    <circle cx="325" cy="160" r="4"/>
    <circle cx="343" cy="160" r="4"/>
    <circle cx="361" cy="160" r="4"/>
    <circle cx="379" cy="160" r="4"/>
    <!-- Row 2 -->
    <circle cx="253" cy="180" r="4"/>
    <circle cx="271" cy="180" r="4"/>
    <circle cx="289" cy="180" r="4"/>
    <circle cx="307" cy="180" r="4"/>
    <circle cx="325" cy="180" r="4"/>
    <circle cx="343" cy="180" r="4"/>
    <circle cx="361" cy="180" r="4"/>
    <circle cx="379" cy="180" r="4"/>
  </g>
  
  <!-- Process 2 -->
  <rect x="410" y="90" width="155" height="130" rx="4" ry="4" fill="#fdebd0" stroke="#e67e22" stroke-width="2"/>
  <rect x="410" y="90" width="155" height="30" rx="4" ry="4" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
  <text x="487" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Process 2</text>
  <text x="487" y="138" text-anchor="middle" font-size="12" fill="#2c3e50">(2x8)</text>
  
  <!-- Grid dots for Process 2 - 2 rows x 8 columns -->
  <g fill="#2c3e50">
    <!-- Row 1 -->
    <circle cx="428" cy="160" r="4"/>
    <circle cx="446" cy="160" r="4"/>
    <circle cx="464" cy="160" r="4"/>
    <circle cx="482" cy="160" r="4"/>
    <circle cx="500" cy="160" r="4"/>
    <circle cx="518" cy="160" r="4"/>
    <circle cx="536" cy="160" r="4"/>
    <circle cx="554" cy="160" r="4"/>
    <!-- Row 2 -->
    <circle cx="428" cy="180" r="4"/>
    <circle cx="446" cy="180" r="4"/>
    <circle cx="464" cy="180" r="4"/>
    <circle cx="482" cy="180" r="4"/>
    <circle cx="500" cy="180" r="4"/>
    <circle cx="518" cy="180" r="4"/>
    <circle cx="536" cy="180" r="4"/>
    <circle cx="554" cy="180" r="4"/>
  </g>
  
  <!-- Process 3 -->
  <rect x="585" y="90" width="155" height="130" rx="4" ry="4" fill="#ebdef0" stroke="#8e44ad" stroke-width="2"/>
  <rect x="585" y="90" width="155" height="30" rx="4" ry="4" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <text x="662" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Process 3</text>
  <text x="662" y="138" text-anchor="middle" font-size="12" fill="#2c3e50">(2x8)</text>
  
  <!-- Grid dots for Process 3 - 2 rows x 8 columns -->
  <g fill="#2c3e50">
    <!-- Row 1 -->
    <circle cx="603" cy="160" r="4"/>
    <circle cx="621" cy="160" r="4"/>
    <circle cx="639" cy="160" r="4"/>
    <circle cx="657" cy="160" r="4"/>
    <circle cx="675" cy="160" r="4"/>
    <circle cx="693" cy="160" r="4"/>
    <circle cx="711" cy="160" r="4"/>
    <circle cx="729" cy="160" r="4"/>
    <!-- Row 2 -->
    <circle cx="603" cy="180" r="4"/>
    <circle cx="621" cy="180" r="4"/>
    <circle cx="639" cy="180" r="4"/>
    <circle cx="657" cy="180" r="4"/>
    <circle cx="675" cy="180" r="4"/>
    <circle cx="693" cy="180" r="4"/>
    <circle cx="711" cy="180" r="4"/>
    <circle cx="729" cy="180" r="4"/>
  </g>
  
  <!-- Horizontal arrows between processes -->
  <line x1="215" y1="150" x2="233" y2="150" stroke="#e67e22" stroke-width="2"/>
  <polygon points="228,145 238,150 228,155" fill="#e67e22"/>
  
  <line x1="390" y1="150" x2="408" y2="150" stroke="#e67e22" stroke-width="2"/>
  <polygon points="403,145 413,150 403,155" fill="#e67e22"/>
  
  <line x1="565" y1="150" x2="583" y2="150" stroke="#e67e22" stroke-width="2"/>
  <polygon points="578,145 588,150 578,155" fill="#e67e22"/>
  
  <!-- Information text -->
  <text x="400" y="280" text-anchor="middle" font-size="12" fill="#2c3e50">Each process computes local_Nx rows</text>
  <text x="400" y="305" text-anchor="middle" font-size="12" fill="#2c3e50">Last process handles remainder if Nx not divisible</text>
  
  <!-- Notes -->
  <rect x="100" y="330" width="600" height="30" rx="4" ry="4" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="400" y="350" text-anchor="middle" font-size="11" fill="#7f8c8d">Global: Nx=8 rows × Ny=8 columns | Each process: 2 rows × 8 columns</text>
</svg>