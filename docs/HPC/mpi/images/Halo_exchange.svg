<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 520" font-family="monospace">
  <!-- Background -->
  <rect width="750" height="520" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="375" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">Process with local_Nx = 4 rows</text>
  
  <!-- Main process box -->
  <rect x="60" y="50" width="620" height="400" rx="4" ry="4" fill="none" stroke="#2c3e50" stroke-width="2.5"/>
  
  <!-- Halo (row 0) - top ghost cells -->
  <rect x="60" y="50" width="620" height="80" rx="4" ry="4" fill="#fdebd0" stroke="#e67e22" stroke-width="2"/>
  
  <!-- Halo text - moved higher -->
  <text x="340" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#e67e22">Halo (row 0)</text>
  <text x="340" y="92" text-anchor="middle" font-size="11" fill="#e67e22">From left neighbor</text>
  
  <!-- Arrow from left for halo - moved up -->
  <line x1="20" y1="82" x2="58" y2="82" stroke="#e67e22" stroke-width="2"/>
  <polygon points="53,77 63,82 53,87" fill="#e67e22"/>
  <text x="12" y="77" text-anchor="end" font-size="10" fill="#e67e22">Recv</text>
  
  <!-- Ghost cells - moved down to avoid text -->
  <g fill="none" stroke="#e67e22" stroke-width="2" stroke-dasharray="4,3">
    <circle cx="150" cy="115" r="6"/>
    <circle cx="195" cy="115" r="6"/>
    <circle cx="240" cy="115" r="6"/>
    <circle cx="285" cy="115" r="6"/>
    <circle cx="330" cy="115" r="6"/>
    <circle cx="375" cy="115" r="6"/>
    <circle cx="420" cy="115" r="6"/>
    <circle cx="465" cy="115" r="6"/>
  </g>
  
  <!-- Ghost cell label - moved to the right side -->
  <text x="510" y="119" font-size="10" fill="#e67e22">○ = Ghost cell</text>
  
  <!-- Computation domain -->
  <rect x="60" y="130" width="620" height="250" rx="4" ry="4" fill="#d6eaf8" stroke="#2980b9" stroke-width="2"/>
  <text x="370" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#2980b9">Actual computation domain (local_Nx)</text>
  
  <!-- Row labels - moved further left -->
  <text x="75" y="192" font-size="10" font-weight="bold" fill="#2980b9">Row 1</text>
  <text x="75" y="232" font-size="10" font-weight="bold" fill="#2980b9">Row 2</text>
  <text x="75" y="272" font-size="10" font-weight="bold" fill="#2980b9">Row 3</text>
  <text x="75" y="312" font-size="10" font-weight="bold" fill="#2980b9">Row 4</text>
  
  <!-- Grid inside computation domain - 4 rows x 8 columns -->
  <!-- Start x at 130 to leave space for row labels -->
  <g fill="#2c3e50">
    <!-- Row 1 (y=192) -->
    <circle cx="140" cy="192" r="4"/>
    <circle cx="185" cy="192" r="4"/>
    <circle cx="230" cy="192" r="4"/>
    <circle cx="275" cy="192" r="4"/>
    <circle cx="320" cy="192" r="4"/>
    <circle cx="365" cy="192" r="4"/>
    <circle cx="410" cy="192" r="4"/>
    <circle cx="455" cy="192" r="4"/>
    
    <!-- Row 2 (y=232) -->
    <circle cx="140" cy="232" r="4"/>
    <circle cx="185" cy="232" r="4"/>
    <circle cx="230" cy="232" r="4"/>
    <circle cx="275" cy="232" r="4"/>
    <circle cx="320" cy="232" r="4"/>
    <circle cx="365" cy="232" r="4"/>
    <circle cx="410" cy="232" r="4"/>
    <circle cx="455" cy="232" r="4"/>
    
    <!-- Row 3 (y=272) -->
    <circle cx="140" cy="272" r="4"/>
    <circle cx="185" cy="272" r="4"/>
    <circle cx="230" cy="272" r="4"/>
    <circle cx="275" cy="272" r="4"/>
    <circle cx="320" cy="272" r="4"/>
    <circle cx="365" cy="272" r="4"/>
    <circle cx="410" cy="272" r="4"/>
    <circle cx="455" cy="272" r="4"/>
    
    <!-- Row 4 (y=312) -->
    <circle cx="140" cy="312" r="4"/>
    <circle cx="185" cy="312" r="4"/>
    <circle cx="230" cy="312" r="4"/>
    <circle cx="275" cy="312" r="4"/>
    <circle cx="320" cy="312" r="4"/>
    <circle cx="365" cy="312" r="4"/>
    <circle cx="410" cy="312" r="4"/>
    <circle cx="455" cy="312" r="4"/>
  </g>
  
  <!-- Halo (row 5) - bottom ghost cells -->
  <rect x="60" y="380" width="620" height="70" rx="4" ry="4" fill="#fdebd0" stroke="#e67e22" stroke-width="2"/>
  <text x="340" y="402" text-anchor="middle" font-size="13" font-weight="bold" fill="#e67e22">Halo (row 5)</text>
  <text x="340" y="422" text-anchor="middle" font-size="11" fill="#e67e22">From right neighbor</text>
  
  <!-- Arrow from right for halo -->
  <line x1="680" y1="412" x2="730" y2="412" stroke="#e67e22" stroke-width="2"/>
  <polygon points="725,407 735,412 725,417" fill="#e67e22"/>
  <text x="740" y="407" text-anchor="start" font-size="10" fill="#e67e22">Recv</text>
  
  <!-- Bottom ghost cells -->
  <g fill="none" stroke="#e67e22" stroke-width="2" stroke-dasharray="4,3">
    <circle cx="150" cy="438" r="6"/>
    <circle cx="195" cy="438" r="6"/>
    <circle cx="240" cy="438" r="6"/>
    <circle cx="285" cy="438" r="6"/>
    <circle cx="330" cy="438" r="6"/>
    <circle cx="375" cy="438" r="6"/>
    <circle cx="420" cy="438" r="6"/>
    <circle cx="465" cy="438" r="6"/>
  </g>
  
  <!-- Bottom ghost cell label -->
  <text x="510" y="442" font-size="10" fill="#e67e22">○ = Ghost cell</text>
  
  <!-- Legend box -->
  <rect x="60" y="470" width="620" height="35" rx="4" ry="4" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="90" y="492" font-size="11" font-weight="bold" fill="#495057">Legend:</text>
  
  <circle cx="160" cy="488" r="4" fill="#2c3e50"/>
  <text x="175" y="493" font-size="10" fill="#495057">= Data point</text>
  
  <circle cx="260" cy="488" r="6" fill="none" stroke="#e67e22" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="275" y="493" font-size="10" fill="#495057">= Halo ghost cell</text>
  
  <line x1="400" y1="488" x2="430" y2="488" stroke="#e67e22" stroke-width="2"/>
  <polygon points="425,484 435,488 425,492" fill="#e67e22"/>
  <text x="445" y="493" font-size="10" fill="#495057">= MPI communication</text>
</svg>