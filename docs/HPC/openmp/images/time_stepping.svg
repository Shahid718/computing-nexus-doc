<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="monospace">
  <!-- Background -->
  <rect width="800" height="500" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">OpenMP Parallel Time Stepping</text>
  
  <!-- Time Step t -->
  <text x="400" y="55" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">Time Step t</text>
  
  <!-- Arrow from Time Step t -->
  <line x1="400" y1="60" x2="400" y2="80" stroke="#2c3e50" stroke-width="2"/>
  <polygon points="394,75 406,75 400,83" fill="#2c3e50"/>
  
  <!-- Main box -->
  <rect x="50" y="85" width="700" height="340" rx="6" ry="6" fill="#f8f9fa" stroke="#2c3e50" stroke-width="2.5"/>
  
  <!-- Step 1 -->
  <rect x="70" y="100" width="660" height="45" rx="4" ry="4" fill="#d6eaf8" stroke="#2980b9" stroke-width="1.5"/>
  <text x="90" y="118" font-size="13" font-weight="bold" fill="#2980b9">1. Parallel Compute: dfdcon, lap_con, dummy_con</text>
  <text x="90" y="136" font-size="11" fill="#2c3e50">└─► All threads compute their portion of the domain</text>
  
  <!-- Arrow -->
  <line x1="400" y1="145" x2="400" y2="155" stroke="#7f8c8d" stroke-width="1.5"/>
  <polygon points="396,150 404,150 400,158" fill="#7f8c8d"/>
  
  <!-- Step 2 -->
  <rect x="70" y="160" width="660" height="45" rx="4" ry="4" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/>
  <text x="90" y="178" font-size="13" font-weight="bold" fill="#27ae60">2. Parallel Compute: lap_dummy, con_new</text>
  <text x="90" y="196" font-size="11" fill="#2c3e50">└─► Euler time integration (no communication needed)</text>
  
  <!-- Arrow -->
  <line x1="400" y1="205" x2="400" y2="215" stroke="#7f8c8d" stroke-width="1.5"/>
  <polygon points="396,210 404,210 400,218" fill="#7f8c8d"/>
  
  <!-- Step 3 -->
  <rect x="70" y="220" width="660" height="45" rx="4" ry="4" fill="#fdebd0" stroke="#e67e22" stroke-width="1.5"/>
  <text x="90" y="238" font-size="13" font-weight="bold" fill="#e67e22">3. Swap con and con_new</text>
  <text x="90" y="256" font-size="11" fill="#2c3e50">└─► Ready for next time step</text>
  
  <!-- Arrow -->
  <line x1="400" y1="265" x2="400" y2="275" stroke="#7f8c8d" stroke-width="1.5"/>
  <polygon points="396,270 404,270 400,278" fill="#7f8c8d"/>
  
  <!-- Step 4 -->
  <rect x="70" y="280" width="660" height="45" rx="4" ry="4" fill="#ebdef0" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="90" y="298" font-size="13" font-weight="bold" fill="#8e44ad">4. Optional: Print progress</text>
  <text x="90" y="316" font-size="11" fill="#2c3e50">└─► Only rank 0 prints to avoid duplicate output</text>
  
  <!-- Thread visualization -->
  <rect x="70" y="340" width="660" height="70" rx="4" ry="4" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>
  <text x="400" y="360" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50">Thread Execution Visualization</text>
  
  <!-- Thread bars -->
  <rect x="100" y="375" width="580" height="25" rx="3" fill="#3498db" stroke="#2980b9" stroke-width="1"/>
  <text x="390" y="393" text-anchor="middle" font-size="9" fill="white">Thread 0: i=0..500</text>
  
  <rect x="100" y="375" width="580" height="25" rx="3" fill="#2ecc71" stroke="#27ae60" stroke-width="1" transform="translate(0,25)"/>
  <text x="390" y="418" text-anchor="middle" font-size="9" fill="white">Thread 1: i=500..1000</text>
  
  <rect x="100" y="375" width="580" height="25" rx="3" fill="#e67e22" stroke="#d35400" stroke-width="1" transform="translate(0,50)"/>
  <text x="390" y="443" text-anchor="middle" font-size="9" fill="white">Thread 2: i=1000..1500</text>
  
  <rect x="100" y="375" width="580" height="25" rx="3" fill="#8e44ad" stroke="#6c3483" stroke-width="1" transform="translate(0,75)"/>
  <text x="390" y="468" text-anchor="middle" font-size="9" fill="white">Thread N: i=1500..2000</text>
  
  <!-- Arrow from main box -->
  <line x1="400" y1="425" x2="400" y2="443" stroke="#2c3e50" stroke-width="2"/>
  <polygon points="394,438 406,438 400,446" fill="#2c3e50"/>
  
  <!-- Time Step t+1 -->
  <text x="400" y="465" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">Time Step t+1</text>
</svg>
