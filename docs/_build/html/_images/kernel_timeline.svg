<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="monospace">
  <!-- Background -->
  <rect width="800" height="500" fill="#ffffff"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">CUDA Time-Stepping Loop (per iteration)</text>

  <!-- Time Step t -->
  <text x="400" y="55" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">Time Step t</text>

  <line x1="400" y1="60" x2="400" y2="80" stroke="#2c3e50" stroke-width="2"/>
  <polygon points="394,75 406,75 400,83" fill="#2c3e50"/>

  <!-- Main box -->
  <rect x="50" y="85" width="700" height="365" rx="6" ry="6" fill="#f8f9fa" stroke="#2c3e50" stroke-width="2.5"/>

  <!-- Step 1 -->
  <rect x="70" y="100" width="660" height="50" rx="4" ry="4" fill="#d6eaf8" stroke="#2980b9" stroke-width="1.5"/>
  <text x="90" y="120" font-size="13" font-weight="bold" fill="#2980b9">1. compute_first_laplacian_kernel&lt;&lt;&lt;numBlocks, threadsPerBlock&gt;&gt;&gt;</text>
  <text x="90" y="138" font-size="10" fill="#2c3e50">└─► Every GPU thread computes df/dc and ∇²c for one grid point, in parallel</text>

  <line x1="400" y1="150" x2="400" y2="160" stroke="#7f8c8d" stroke-width="1.5"/>
  <polygon points="396,155 404,155 400,163" fill="#7f8c8d"/>

  <!-- Step 2 -->
  <rect x="70" y="165" width="660" height="35" rx="4" ry="4" fill="#fdebd0" stroke="#e67e22" stroke-width="1.5"/>
  <text x="90" y="187" font-size="12" font-weight="bold" fill="#e67e22">2. CUDA_CHECK(cudaGetLastError())  — verify kernel 1 launched cleanly</text>

  <line x1="400" y1="200" x2="400" y2="210" stroke="#7f8c8d" stroke-width="1.5"/>
  <polygon points="396,205 404,205 400,213" fill="#7f8c8d"/>

  <!-- Step 3 -->
  <rect x="70" y="215" width="660" height="50" rx="4" ry="4" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/>
  <text x="90" y="235" font-size="13" font-weight="bold" fill="#27ae60">3. compute_second_laplacian_kernel&lt;&lt;&lt;numBlocks, threadsPerBlock&gt;&gt;&gt;</text>
  <text x="90" y="253" font-size="10" fill="#2c3e50">└─► Computes μ, ∇²μ, and advances con_new = con + dt·M·∇²μ (Euler step)</text>

  <line x1="400" y1="265" x2="400" y2="275" stroke="#7f8c8d" stroke-width="1.5"/>
  <polygon points="396,270 404,270 400,278" fill="#7f8c8d"/>

  <!-- Step 4 -->
  <rect x="70" y="280" width="660" height="35" rx="4" ry="4" fill="#fdebd0" stroke="#e67e22" stroke-width="1.5"/>
  <text x="90" y="302" font-size="12" font-weight="bold" fill="#e67e22">4. CUDA_CHECK(cudaGetLastError())  — verify kernel 2 launched cleanly</text>

  <line x1="400" y1="315" x2="400" y2="325" stroke="#7f8c8d" stroke-width="1.5"/>
  <polygon points="396,320 404,320 400,328" fill="#7f8c8d"/>

  <!-- Step 5 -->
  <rect x="70" y="330" width="660" height="45" rx="4" ry="4" fill="#ebdef0" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="90" y="350" font-size="13" font-weight="bold" fill="#8e44ad">5. std::swap(d_con, d_con_new)</text>
  <text x="90" y="368" font-size="10" fill="#2c3e50">└─► Pointer swap on the host; no device-to-device data copy needed</text>

  <line x1="400" y1="375" x2="400" y2="385" stroke="#7f8c8d" stroke-width="1.5"/>
  <polygon points="396,380 404,380 400,388" fill="#7f8c8d"/>

  <!-- Step 6 -->
  <rect x="70" y="390" width="660" height="40" rx="4" ry="4" fill="#d6eaf8" stroke="#2980b9" stroke-width="1.5"/>
  <text x="90" y="410" font-size="12" font-weight="bold" fill="#2980b9">6. if (tsteps % nprint == 0) print progress</text>
  <text x="90" y="424" font-size="9" fill="#2c3e50">└─► Host-side check only; no kernel launch on most iterations</text>

  <line x1="400" y1="430" x2="400" y2="443" stroke="#2c3e50" stroke-width="2"/>
  <polygon points="394,438 406,438 400,446" fill="#2c3e50"/>

  <!-- Time Step t+1 -->
  <text x="400" y="465" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">Time Step t+1</text>

  <text x="400" y="485" text-anchor="middle" font-size="9" fill="#7f8c8d">Kernel launches are asynchronous; the CPU queues both kernels and moves on to the next check</text>
</svg>
