<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="monospace">
  <!-- Background -->
  <rect width="900" height="700" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c3e50">High Performance Computing System Architecture</text>
  
  <!-- Cluster layer -->
  <rect x="50" y="50" width="800" height="250" rx="8" ry="8" fill="#ebf5fb" stroke="#2980b9" stroke-width="2.5"/>
  <text x="450" y="75" text-anchor="middle" font-size="16" font-weight="bold" fill="#2980b9">Distributed Programming (MPI) - Inter-node Communication</text>
  
  <!-- Node 1 -->
  <rect x="80" y="95" width="340" height="180" rx="6" ry="6" fill="#d6eaf8" stroke="#2980b9" stroke-width="2"/>
  <text x="250" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#2980b9">Node 1</text>
  
  <!-- Shared Memory within Node 1 -->
  <rect x="100" y="130" width="300" height="130" rx="4" ry="4" fill="#f8f9fa" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="250" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50">Shared Memory (OpenMP)</text>
  
  <!-- CPU cores in Node 1 -->
  <rect x="120" y="160" width="60" height="35" rx="3" fill="#3498db" stroke="#2980b9" stroke-width="1.5"/>
  <text x="150" y="182" text-anchor="middle" font-size="10" fill="white">CPU Core 1</text>
  
  <rect x="190" y="160" width="60" height="35" rx="3" fill="#3498db" stroke="#2980b9" stroke-width="1.5"/>
  <text x="220" y="182" text-anchor="middle" font-size="10" fill="white">CPU Core 2</text>
  
  <rect x="260" y="160" width="60" height="35" rx="3" fill="#3498db" stroke="#2980b9" stroke-width="1.5"/>
  <text x="290" y="182" text-anchor="middle" font-size="10" fill="white">CPU Core N</text>
  
  <!-- GPU in Node 1 -->
  <rect x="150" y="205" width="200" height="40" rx="3" fill="#27ae60" stroke="#1e8449" stroke-width="1.5"/>
  <text x="250" y="225" text-anchor="middle" font-size="11" font-weight="bold" fill="white">GPU Accelerator (CUDA)</text>
  <text x="250" y="240" text-anchor="middle" font-size="9" fill="#d5f5e3">Thousands of CUDA Cores</text>
  
  <!-- Node 2 -->
  <rect x="480" y="95" width="340" height="180" rx="6" ry="6" fill="#d5f5e3" stroke="#27ae60" stroke-width="2"/>
  <text x="650" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Node 2</text>
  
  <!-- Shared Memory within Node 2 -->
  <rect x="500" y="130" width="300" height="130" rx="4" ry="4" fill="#f8f9fa" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="650" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50">Shared Memory (OpenMP)</text>
  
  <!-- CPU cores in Node 2 -->
  <rect x="520" y="160" width="60" height="35" rx="3" fill="#2ecc71" stroke="#27ae60" stroke-width="1.5"/>
  <text x="550" y="182" text-anchor="middle" font-size="10" fill="white">CPU Core 1</text>
  
  <rect x="590" y="160" width="60" height="35" rx="3" fill="#2ecc71" stroke="#27ae60" stroke-width="1.5"/>
  <text x="620" y="182" text-anchor="middle" font-size="10" fill="white">CPU Core 2</text>
  
  <rect x="660" y="160" width="60" height="35" rx="3" fill="#2ecc71" stroke="#27ae60" stroke-width="1.5"/>
  <text x="690" y="182" text-anchor="middle" font-size="10" fill="white">CPU Core N</text>
  
  <!-- GPU in Node 2 -->
  <rect x="550" y="205" width="200" height="40" rx="3" fill="#27ae60" stroke="#1e8449" stroke-width="1.5"/>
  <text x="650" y="225" text-anchor="middle" font-size="11" font-weight="bold" fill="white">GPU Accelerator (CUDA)</text>
  <text x="650" y="240" text-anchor="middle" font-size="9" fill="#d5f5e3">Thousands of CUDA Cores</text>
  
  <!-- MPI Communication between nodes -->
  <line x1="420" y1="180" x2="478" y2="180" stroke="#e74c3c" stroke-width="3" stroke-dasharray="8,4"/>
  <text x="450" y="170" text-anchor="middle" font-size="11" font-weight="bold" fill="#e74c3c">MPI</text>
  <polygon points="473,175 483,180 473,185" fill="#e74c3c"/>
  <polygon points="425,175 415,180 425,185" fill="#e74c3c"/>
  
  <!-- Network Layer -->
  <rect x="50" y="310" width="800" height="80" rx="6" ry="6" fill="#fdebd0" stroke="#e67e22" stroke-width="2.5"/>
  <text x="450" y="338" text-anchor="middle" font-size="15" font-weight="bold" fill="#e67e22">High-Speed Interconnect (InfiniBand/MPI)</text>
  <text x="450" y="360" text-anchor="middle" font-size="11" fill="#2c3e50">Low-latency, high-bandwidth communication between compute nodes</text>
  
  <!-- Arrows from nodes to network -->
  <line x1="250" y1="275" x2="250" y2="308" stroke="#7f8c8d" stroke-width="2"/>
  <polygon points="246,303 250,310 254,303" fill="#7f8c8d"/>
  
  <line x1="650" y1="275" x2="650" y2="308" stroke="#7f8c8d" stroke-width="2"/>
  <polygon points="646,303 650,310 654,303" fill="#7f8c8d"/>
  
  <!-- Storage Layer -->
  <rect x="50" y="400" width="800" height="70" rx="6" ry="6" fill="#ebdef0" stroke="#8e44ad" stroke-width="2.5"/>
  <text x="450" y="428" text-anchor="middle" font-size="15" font-weight="bold" fill="#8e44ad">Parallel File System (Lustre/GPFS)</text>
  <text x="450" y="450" text-anchor="middle" font-size="11" fill="#2c3e50">Shared storage accessible by all nodes for input/output operations</text>
  
  <!-- Arrows from network to storage -->
  <line x1="250" y1="390" x2="250" y2="398" stroke="#7f8c8d" stroke-width="2"/>
  <polygon points="246,393 250,400 254,393" fill="#7f8c8d"/>
  
  <line x1="650" y1="390" x2="650" y2="398" stroke="#7f8c8d" stroke-width="2"/>
  <polygon points="646,393 650,400 654,393" fill="#7f8c8d"/>
  
  <!-- Programming Models Legend -->
  <rect x="50" y="490" width="800" height="95" rx="6" ry="6" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
  <text x="450" y="515" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c3e50">Programming Models</text>
  
  <!-- MPI -->
  <rect x="80" y="530" width="220" height="40" rx="4" fill="#d6eaf8" stroke="#2980b9" stroke-width="2"/>
  <text x="190" y="555" text-anchor="middle" font-size="12" font-weight="bold" fill="#2980b9">MPI (Distributed Memory)</text>
  
  <!-- OpenMP -->
  <rect x="340" y="530" width="220" height="40" rx="4" fill="#d5f5e3" stroke="#27ae60" stroke-width="2"/>
  <text x="450" y="555" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">OpenMP (Shared Memory)</text>
  
  <!-- CUDA -->
  <rect x="600" y="530" width="220" height="40" rx="4" fill="#fdebd0" stroke="#e67e22" stroke-width="2"/>
  <text x="710" y="555" text-anchor="middle" font-size="12" font-weight="bold" fill="#e67e22">CUDA (GPU Computing)</text>
  
  <!-- Languages -->
  <rect x="50" y="595" width="800" height="35" rx="4" ry="4" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>
  <text x="450" y="617" text-anchor="middle" font-size="11" fill="#7f8c8d">Supported Languages: C++ • Fortran • CUDA</text>
  
  <!-- Benefits -->
  <rect x="50" y="640" width="800" height="50" rx="4" ry="4" fill="#fef9e7" stroke="#f1c40f" stroke-width="2"/>
  <text x="450" y="658" text-anchor="middle" font-size="12" font-weight="bold" fill="#7d6608">Benefits:</text>
  <text x="180" y="678" text-anchor="middle" font-size="11" fill="#2c3e50">✓ Scalability</text>
  <text x="380" y="678" text-anchor="middle" font-size="11" fill="#2c3e50">✓ Performance</text>
  <text x="580" y="678" text-anchor="middle" font-size="11" fill="#2c3e50">✓ Efficiency</text>
  <text x="780" y="678" text-anchor="middle" font-size="11" fill="#2c3e50">✓ Portability</text>
</svg>