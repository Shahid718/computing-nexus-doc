<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" font-family="monospace">
  <!-- Background -->
  <rect width="850" height="520" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="425" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">Visual Communication Pattern</text>
  
  <!-- Process 0 -->
  <rect x="50" y="60" width="160" height="380" rx="4" ry="4" fill="#d6eaf8" stroke="#2980b9" stroke-width="2"/>
  <rect x="50" y="60" width="160" height="30" rx="4" ry="4" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="130" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Process 0</text>
  
  <!-- Process 0 rows -->
  <rect x="65" y="105" width="130" height="35" rx="2" fill="#ebf5fb" stroke="#2980b9" stroke-width="1"/>
  <text x="130" y="127" text-anchor="middle" font-size="11" fill="#2c3e50">Row 1</text>
  
  <rect x="65" y="150" width="130" height="35" rx="2" fill="#ebf5fb" stroke="#2980b9" stroke-width="1"/>
  <text x="130" y="172" text-anchor="middle" font-size="11" fill="#2c3e50">Row 2</text>
  
  <rect x="65" y="195" width="130" height="35" rx="2" fill="#ebf5fb" stroke="#2980b9" stroke-width="1"/>
  <text x="130" y="217" text-anchor="middle" font-size="11" fill="#2c3e50">Row 3</text>
  
  <!-- Halo right in Process 0 -->
  <rect x="65" y="240" width="130" height="35" rx="2" fill="#fdebd0" stroke="#e67e22" stroke-width="1.5"/>
  <text x="130" y="262" text-anchor="middle" font-size="11" fill="#e67e22">Halo right</text>
  
  <!-- Arrow from Process 0 Halo right to Process 1 -->
  <line x1="210" y1="257" x2="248" y2="257" stroke="#e74c3c" stroke-width="2.5"/>
  <polygon points="243,252 253,257 243,262" fill="#e74c3c"/>
  <text x="220" y="250" font-size="9" fill="#e74c3c">MPI_Send</text>
  
  <!-- Process 1 -->
  <rect x="260" y="60" width="160" height="380" rx="4" ry="4" fill="#d5f5e3" stroke="#27ae60" stroke-width="2"/>
  <rect x="260" y="60" width="160" height="30" rx="4" ry="4" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
  <text x="340" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Process 1</text>
  
  <!-- Halo left in Process 1 -->
  <rect x="275" y="105" width="130" height="35" rx="2" fill="#fdebd0" stroke="#e67e22" stroke-width="1.5"/>
  <text x="340" y="127" text-anchor="middle" font-size="11" fill="#e67e22">Halo left</text>
  
  <!-- Arrow to Halo left (receiving) -->
  <line x1="248" y1="122" x2="273" y2="122" stroke="#3498db" stroke-width="2.5"/>
  <polygon points="268,117 278,122 268,127" fill="#3498db"/>
  <text x="250" y="115" font-size="9" fill="#3498db">MPI_Recv</text>
  
  <!-- Process 1 rows -->
  <rect x="275" y="150" width="130" height="35" rx="2" fill="#d5f5e3" stroke="#27ae60" stroke-width="1"/>
  <text x="340" y="172" text-anchor="middle" font-size="11" fill="#2c3e50">Row 4</text>
  
  <rect x="275" y="195" width="130" height="35" rx="2" fill="#d5f5e3" stroke="#27ae60" stroke-width="1"/>
  <text x="340" y="217" text-anchor="middle" font-size="11" fill="#2c3e50">Row 5</text>
  
  <rect x="275" y="240" width="130" height="35" rx="2" fill="#d5f5e3" stroke="#27ae60" stroke-width="1"/>
  <text x="340" y="262" text-anchor="middle" font-size="11" fill="#2c3e50">Row 6</text>
  
  <!-- Halo right in Process 1 -->
  <rect x="275" y="285" width="130" height="35" rx="2" fill="#fdebd0" stroke="#e67e22" stroke-width="1.5"/>
  <text x="340" y="307" text-anchor="middle" font-size="11" fill="#e67e22">Halo right</text>
  
  <!-- Arrow from Process 1 Halo right to Process 2 -->
  <line x1="420" y1="302" x2="458" y2="302" stroke="#e74c3c" stroke-width="2.5"/>
  <polygon points="453,297 463,302 453,307" fill="#e74c3c"/>
  <text x="430" y="295" font-size="9" fill="#e74c3c">MPI_Send</text>
  
  <!-- Process 2 -->
  <rect x="470" y="60" width="160" height="380" rx="4" ry="4" fill="#fdebd0" stroke="#e67e22" stroke-width="2"/>
  <rect x="470" y="60" width="160" height="30" rx="4" ry="4" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
  <text x="550" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Process 2</text>
  
  <!-- Halo left in Process 2 -->
  <rect x="485" y="105" width="130" height="35" rx="2" fill="#fdebd0" stroke="#e67e22" stroke-width="1.5"/>
  <text x="550" y="127" text-anchor="middle" font-size="11" fill="#e67e22">Halo left</text>
  
  <!-- Arrow to Halo left (receiving) -->
  <line x1="458" y1="122" x2="483" y2="122" stroke="#3498db" stroke-width="2.5"/>
  <polygon points="478,117 488,122 478,127" fill="#3498db"/>
  <text x="460" y="115" font-size="9" fill="#3498db">MPI_Recv</text>
  
  <!-- Process 2 rows -->
  <rect x="485" y="150" width="130" height="35" rx="2" fill="#fdebd0" stroke="#e67e22" stroke-width="1"/>
  <text x="550" y="172" text-anchor="middle" font-size="11" fill="#2c3e50">Row 7</text>
  
  <rect x="485" y="195" width="130" height="35" rx="2" fill="#fdebd0" stroke="#e67e22" stroke-width="1"/>
  <text x="550" y="217" text-anchor="middle" font-size="11" fill="#2c3e50">Row 8</text>
  
  <rect x="485" y="240" width="130" height="35" rx="2" fill="#fdebd0" stroke="#e67e22" stroke-width="1"/>
  <text x="550" y="262" text-anchor="middle" font-size="11" fill="#2c3e50">Row 9</text>
  
  <rect x="485" y="285" width="130" height="35" rx="2" fill="#fdebd0" stroke="#e67e22" stroke-width="1"/>
  <text x="550" y="307" text-anchor="middle" font-size="11" fill="#2c3e50">Row 10</text>
  
  <!-- Arrow from Process 2 Halo left back to Process 0 (wrap around) -->
  <path d="M 550 395 L 550 450 L 130 450 L 130 395" fill="none" stroke="#9b59b6" stroke-width="2.5" stroke-dasharray="6,4"/>
  <polygon points="135,395 130,405 125,395" fill="#9b59b6"/>
  <text x="350" y="465" text-anchor="middle" font-size="9" fill="#9b59b6">MPI_Sendrecv (wrap-around)</text>
  
  <!-- Process 0 Halo right receiving from Process 1 (vertical arrow) -->
  <line x1="130" y1="275" x2="130" y2="365" stroke="#3498db" stroke-width="2.5"/>
  <polygon points="125,360 135,365 125,370" fill="#3498db"/>
  
  <!-- Process 1 Halo right receiving from Process 0 -->
  <line x1="340" y1="320" x2="340" y2="365" stroke="#3498db" stroke-width="2.5"/>
  <polygon points="335,360 345,365 335,370" fill="#3498db"/>
  
  <!-- Arrow from Process 0 Row 1 to Process 1 Halo left -->
  <line x1="195" y1="122" x2="248" y2="122" stroke="#e74c3c" stroke-width="2.5"/>
  <polygon points="243,117 253,122 243,127" fill="#e74c3c"/>
  
  <!-- Communication labels -->
  <text x="220" y="140" text-anchor="middle" font-size="9" fill="#e74c3c">Send</text>
  
  <!-- Legend box -->
  <rect x="50" y="470" width="580" height="40" rx="4" ry="4" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="75" y="495" font-size="11" font-weight="bold" fill="#495057">Legend:</text>
  
  <line x1="160" y1="490" x2="190" y2="490" stroke="#e74c3c" stroke-width="2.5"/>
  <polygon points="185,485 195,490 185,495" fill="#e74c3c"/>
  <text x="200" y="495" font-size="10" fill="#495057">MPI_Send</text>
  
  <line x1="290" y1="490" x2="320" y2="490" stroke="#3498db" stroke-width="2.5"/>
  <polygon points="315,485 325,490 315,495" fill="#3498db"/>
  <text x="330" y="495" font-size="10" fill="#495057">MPI_Recv</text>
  
  <line x1="420" y1="490" x2="450" y2="490" stroke="#9b59b6" stroke-width="2.5" stroke-dasharray="6,4"/>
  <polygon points="445,485 455,490 445,495" fill="#9b59b6"/>
  <text x="460" y="495" font-size="10" fill="#495057">MPI_Sendrecv</text>
</svg>